<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}#spin{position:absolute;right:40px;top:40px;width:120px;height:120px}</style></head>
<body><canvas id="c" width="1472" height="828"></canvas><canvas id="spin" width="120" height="120"></canvas>
<script>
// the frames another app wrote, drawn as they come and checked every 20th; and something that moves on every display
// frame (as the editor's timeline does while you scroll), so a window that stops drawing shows in the trace
const c = document.getElementById('c'), g = c.getContext('2d');
const s = document.getElementById('spin').getContext('2d');
const probe = (x, y) => { const d = g.getImageData(x, y, 1, 1).data; return [d[0], d[1], d[2]]; };
let n = 0;
window.zc.onFrame(async (imported, a) => {
  const t0 = performance.now();
  const vf = imported.getVideoFrame();
  g.drawImage(vf, 0, 0);
  vf.close();
  const r = { frame: a.frame, made: a.made, sentAt: a.sentAt, got: Date.now(), drawMs: +(performance.now() - t0).toFixed(2) };
  if (n++ % 20 === 0) { r.corner = probe(8, 8); r.bar = probe(a.bar + 32, 400); r.bg = probe((a.bar + 400) % 1472, 400); }
  window.zc.drawn(r);
});
let k = 0;
const spin = () => { k++; s.fillStyle = '#222'; s.fillRect(0, 0, 120, 120); s.fillStyle = '#6cf'; s.save(); s.translate(60, 60); s.rotate(k / 20); s.fillRect(-50, -6, 100, 12); s.restore(); requestAnimationFrame(spin); };
requestAnimationFrame(spin);
window.zc.report({ ready: true });
</script></body></html>
